<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tableau Embedded Analytics Demo</title>
  <script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- TOP NAV -->
  <nav class="navbar">
    <div class="navbar-brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="4" fill="#E8762D"/>
        <path d="M15 7h2v18h-2z" fill="white"/>
        <path d="M7 15h18v2H7z" fill="white"/>
        <path d="M10.5 10.5l1.4-1.4 9.6 9.6-1.4 1.4z" fill="white"/>
        <path d="M20.1 9.1l1.4 1.4-9.6 9.6-1.4-1.4z" fill="white"/>
      </svg>
      <span>Tableau Embedded Demo</span>
    </div>
    <div class="navbar-right">
      <div class="user-switcher">
        <label>Signed in as:</label>
        <select id="userSelect" onchange="switchUser(this.value)">
          <option value="user_east">user_east@demo.com</option>
          <option value="user_west">user_west@demo.com</option>
          <option value="user_all">user_admin@demo.com</option>
        </select>
      </div>
      <div class="jwt-badge" id="jwtBadge" title="Click to inspect JWT">
        <span class="dot green"></span> SSO Active
      </div>
    </div>
  </nav>

  <div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">

      <!-- SECTION: Viz Switcher -->
      <div class="sidebar-section">
        <div class="section-label">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2h14v2H1zm0 5h14v2H1zm0 5h14v2H1z"/></svg>
          View
        </div>
        <button class="viz-btn active" onclick="switchViz('dashboard', this)">Dashboard Overview</button>
        <button class="viz-btn" onclick="switchViz('salesmap', this)">Sales Map</button>
        <button class="viz-btn" onclick="switchViz('trends', this)">Sales Trends</button>
      </div>

      <!-- SECTION: Region Filters (Static) -->
      <div class="sidebar-section">
        <div class="section-label">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M6 2l4 4H8v8H6V6H4l2-4z"/></svg>
          Region Filter
        </div>
        <div class="filter-chips">
          <button class="chip" onclick="applyFilter('Region', ['Central'])">Central</button>
          <button class="chip" onclick="applyFilter('Region', ['East'])">East</button>
          <button class="chip" onclick="applyFilter('Region', ['South'])">South</button>
          <button class="chip" onclick="applyFilter('Region', ['West'])">West</button>
          <button class="chip chip-clear" onclick="clearFilter('Region')">✕ Clear</button>
        </div>
      </div>

      <!-- SECTION: Category Filter (Dynamic) -->
      <div class="sidebar-section">
        <div class="section-label">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4h12v2H2zm2 4h8v2H4zm2 4h4v2H6z"/></svg>
          Category Filter
          <span class="badge-dynamic">dynamic</span>
        </div>
        <div id="dynFilterContainer" class="filter-chips">
          <span class="loading-text">Loading from viz...</span>
        </div>
      </div>

      <!-- SECTION: Actions -->
      <div class="sidebar-section">
        <div class="section-label">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3z"/></svg>
          Actions
        </div>
        <button class="action-btn" onclick="viz.revertAllAsync()">↺ Reset View</button>
        <button class="action-btn" onclick="viz.undoAsync()">← Undo</button>
        <button class="action-btn" onclick="viz.redoAsync()">→ Redo</button>
      </div>

      <!-- SECTION: UAF Info -->
      <div class="sidebar-section uaf-section">
        <div class="section-label">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l6 3v5c0 3-2.7 5.7-6 7C2.7 14.7 2 12 2 9V4l6-3z"/></svg>
          Row-Level Security
        </div>
        <div class="uaf-info" id="uafInfo">
          <div class="uaf-label">User Attribute (UAF)</div>
          <div class="uaf-value" id="uafValue">Loading...</div>
          <div class="uaf-hint">Data filtered server-side via JWT claim</div>
        </div>
      </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- VIZ CONTAINER -->
      <div class="viz-wrapper">
        <div class="viz-header">
          <span id="vizTitle">Dashboard Overview</span>
          <span class="viz-meta" id="vizMeta">Connected via JWT · SSO</span>
        </div>
        <tableau-viz
          id="tableauViz"
          src="{{ tableau_viz_url }}"
          token="{{ jwt_token }}"
          toolbar="hidden"
          hide-tabs
          width="100%"
          height="100%">
        </tableau-viz>
      </div>

      <!-- MARK SELECTION PANEL -->
      <div class="mark-panel" id="markPanel" style="display:none;">
        <div class="mark-panel-header">
          <span>📍 Selected: <strong id="markTitle"></strong></span>
          <button onclick="document.getElementById('markPanel').style.display='none'">✕</button>
        </div>
        <iframe id="wikiFrame" src="" width="100%" height="280" frameborder="0"></iframe>
      </div>

    </main>

    <!-- RIGHT PANEL: JWT Inspector -->
    <div class="jwt-panel" id="jwtPanel">
      <div class="jwt-panel-header">
        <span>JWT Payload</span>
        <button onclick="toggleJwtPanel()">✕</button>
      </div>
      <pre id="jwtPayload" class="jwt-code">Click "SSO Active" to inspect token</pre>
    </div>

  </div>

  <!-- JWT MODAL OVERLAY -->
  <div class="modal-overlay" id="modalOverlay" onclick="toggleJwtPanel()"></div>

  <script src="/static/js/embed.js"></script>
  <script>
    // Pass server-side values to JS
    const TABLEAU_VIZ_URL = "{{ tableau_viz_url }}";
    const CURRENT_USER = "{{ current_user }}";
    const UAF_VALUES = {{ uaf_values | tojson }};
    const JWT_TOKEN = "{{ jwt_token }}";
  </script>

</body>
</html>
